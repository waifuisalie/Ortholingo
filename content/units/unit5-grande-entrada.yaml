unit:
  id: unit5-grande-entrada
  title: "A Grande Entrada"
  section: fieis
  order: 5
  intro_pt: >-
    O momento em que os dons — o pão e o vinho — são levados em procissão até
    o altar. O povo canta o Hino Querubínico, e o sacerdote, diante da porta
    do iconostásio, recorda a todos no Reino. Muitos se persignam. Aqui você
    aprende a cantar com o coro e a reconhecer o que o sacerdote proclama.

items:
  - id: cherubikon
    kind: phrase
    title: "o hino dos querubins"
    greek: "Οἱ τὰ Χερουβεὶμ μυστικῶς εἰκονίζοντες καὶ τῇ ζωοποιῷ Τριάδι τὸν τρισάγιον ὕμνον προσᾴδοντες, πᾶσαν νῦν βιοτικὴν ἀποθώμεθα μέριμναν, ὡς τὸν βασιλέα τῶν ὅλων ὑποδεξόμενοι."
    tts: "Οι τα Χερουβείμ μυστικώς εικονίζοντες και τη ζωοποιώ Τριάδι τον τρισάγιον ύμνον προσάδοντες, πάσαν νυν βιοτικήν αποθώμεθα μέριμναν, ως τον βασιλέα των όλων υποδεξόμενοι."
    words:
      - { el: "Οἱ",            tl: "I", pt: "nós que" }
      - { el: "τὰ",            tl: "ta", pt: "os" }
      - { el: "Χερουβεὶμ",     tl: "Cheruvím", pt: "querubins" }
      - { el: "μυστικῶς",      tl: "mistikós", pt: "misticamente" }
      - { el: "εἰκονίζοντες",  tl: "ikonízondes", pt: "representamos" }
      - { el: "καὶ",           tl: "ke", pt: "e" }
      - { el: "τῇ",            tl: "ti", pt: "à" }
      - { el: "ζωοποιῷ",       tl: "zoopió", pt: "vivificante" }
      - { el: "Τριάδι",        tl: "Triádi", pt: "Trindade" }
      - { el: "τὸν",           tl: "ton", pt: "o" }
      - { el: "τρισάγιον",     tl: "trisáyion", pt: "trisságio" }
      - { el: "ὕμνον",         tl: "ímnon", pt: "hino" }
      - { el: "προσᾴδοντες,",  tl: "prosádondes,", pt: "cantamos" }
      - { el: "πᾶσαν",         tl: "pásan", pt: "toda" }
      - { el: "νῦν",           tl: "nin", pt: "agora" }
      - { el: "βιοτικὴν",      tl: "viotikín", pt: "mundana" }
      - { el: "ἀποθώμεθα",     tl: "apothómetha", pt: "deixemos de lado" }
      - { el: "μέριμναν,",     tl: "mérimnan,", pt: "preocupação" }
      - { el: "ὡς",            tl: "os", pt: "para" }
      - { el: "τὸν",           tl: "ton", pt: "o" }
      - { el: "βασιλέα",       tl: "vasiléa", pt: "Rei" }
      - { el: "τῶν",           tl: "ton", pt: "de" }
      - { el: "ὅλων",          tl: "ólon", pt: "todos" }
      - { el: "ὑποδεξόμενοι.", tl: "ipodexómeni.", pt: "recebermos" }
    pt: "Nós que misticamente representamos os querubins e cantamos à Trindade vivificante o hino trisságio, deixemos agora de lado toda preocupação mundana, para recebermos o Rei de todos."
    segments:
      - { words: "0-4" }
      - { words: "5-12" }
      - { words: "13-23" }
    context_pt: >-
      O Hino Querubínico. Enquanto o coro o canta devagar, o sacerdote prepara
      a Grande Entrada. É um convite a largar tudo — «deixemos toda preocupação
      mundana» — para receber o Rei. Cante com o coro.
    source: "Divina Liturgia (GOA), p. 15"
    tags: [entrada-grande, hino, resposta-do-povo]
    voice: athina
    review: pending

  - id: panton-imon
    kind: phrase
    title: "a todos vós recorde o Senhor"
    greek: "Πάντων ὑμῶν μνησθείη Κύριος ὁ Θεὸς ἐν τῇ βασιλείᾳ αὐτοῦ, πάντοτε, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων."
    tts: "Πάντων υμών μνησθείη Κύριος ο Θεός εν τη βασιλεία αυτού, πάντοτε, νυν και αει και εις τους αιώνας των αιώνων."
    words:
      - { el: "Πάντων",     tl: "Pándon", pt: "a todos" }
      - { el: "ὑμῶν",       tl: "imón", pt: "vós" }
      - { el: "μνησθείη",   tl: "mnisthíi", pt: "recorde" }
      - { el: "Κύριος",     tl: "Kírios", pt: "Senhor" }
      - { el: "ὁ",          tl: "o", pt: "o" }
      - { el: "Θεὸς",       tl: "Theós", pt: "Deus" }
      - { el: "ἐν",         tl: "en", pt: "em" }
      - { el: "τῇ",         tl: "ti", pt: "o" }
      - { el: "βασιλείᾳ",   tl: "vasilía", pt: "reino" }
      - { el: "αὐτοῦ,",     tl: "aftú,", pt: "seu" }
      - { el: "πάντοτε,",   tl: "pándote,", pt: "sempre" }
      - { el: "νῦν",        tl: "nin", pt: "agora" }
      - { el: "καὶ",        tl: "ke", pt: "e" }
      - { el: "ἀεὶ",        tl: "aí", pt: "sempre" }
      - { el: "καὶ",        tl: "ke", pt: "e" }
      - { el: "εἰς",        tl: "is", pt: "para" }
      - { el: "τοὺς",       tl: "tus", pt: "os" }
      - { el: "αἰῶνας",     tl: "eónas", pt: "séculos" }
      - { el: "τῶν",        tl: "ton", pt: "dos" }
      - { el: "αἰώνων.",    tl: "eónon.", pt: "séculos" }
    pt: "A todos vós recorde o Senhor Deus no seu reino, sempre, agora e sempre e pelos séculos dos séculos."
    segments:
      - { words: "0-10" }
      - { words: "11-19" }
    context_pt: >-
      É isto que o sacerdote (ou o diácono) proclama na Grande Entrada, de pé
      diante do povo com os dons sagrados nas mãos: «que o Senhor vos recorde
      no seu Reino». Por isso muitos se persignam. O povo responde «Ἀμήν».
    source: "Divina Liturgia (GOA), p. 16"
    tags: [entrada-grande, sacerdote, para-reconhecer]
    voice: nestoras
    review: pending

  - id: plirosomen
    kind: phrase
    greek: "Πληρώσωμεν τὴν δέησιν ἡμῶν τῷ Κυρίῳ."
    tts: "Πληρώσωμεν την δέησιν ημών τω Κυρίω."
    words:
      - { el: "Πληρώσωμεν", tl: "Plirósomen", pt: "completemos" }
      - { el: "τὴν",        tl: "tin",        pt: "a" }
      - { el: "δέησιν",     tl: "déisin",     pt: "oração" }
      - { el: "ἡμῶν",       tl: "imón",       pt: "nossa" }
      - { el: "τῷ",         tl: "to",         pt: "ao" }
      - { el: "Κυρίῳ.",     tl: "Kirío.",     pt: "Senhor" }
    pt: "Completemos a nossa oração ao Senhor."
    gloss:
      - { el: "πληρώσωμεν", pt: "completemos, levemos a termo (de πλήρης, cheio)" }
      - { el: "δέησιν",     pt: "súplica, oração de pedido" }
    context_pt: >-
      Abre a Litania das Súplicas (τὰ Πληρωτικά), logo depois da Grande
      Entrada. Repare que esta primeira petição ainda se responde «Κύριε,
      ἐλέησον» — só as seguintes é que mudam para «Παράσχου, Κύριε».
    source: "Divina Liturgia (GOA), p. 16"
    tags: [liturgia, litania, diacono, para-reconhecer]
    voice: nestoras
    review: pending

  - id: angelon-irinis
    kind: phrase
    title: "um anjo de paz"
    greek: "Ἄγγελον εἰρήνης, πιστὸν ὁδηγόν, φύλακα τῶν ψυχῶν καὶ τῶν σωμάτων ἡμῶν παρὰ τοῦ Κυρίου αἰτησώμεθα."
    tts: "Άγγελον ειρήνης, πιστόν οδηγόν, φύλακα των ψυχών και των σωμάτων ημών παρά του Κυρίου αιτησώμεθα."
    words:
      - { el: "Ἄγγελον",      tl: "Ányelon",     pt: "um anjo" }
      - { el: "εἰρήνης,",     tl: "irínis,",     pt: "de paz" }
      - { el: "πιστὸν",       tl: "pistón",      pt: "fiel" }
      - { el: "ὁδηγόν,",      tl: "odigón,",     pt: "guia" }
      - { el: "φύλακα",       tl: "fílaka",      pt: "guardião" }
      - { el: "τῶν",          tl: "ton",         pt: "das" }
      - { el: "ψυχῶν",        tl: "psichón",     pt: "almas" }
      - { el: "καὶ",          tl: "ke",          pt: "e" }
      - { el: "τῶν",          tl: "ton",         pt: "dos" }
      - { el: "σωμάτων",      tl: "somáton",     pt: "corpos" }
      - { el: "ἡμῶν",         tl: "imón",        pt: "nossos" }
      - { el: "παρὰ",         tl: "pará",        pt: "a" }
      - { el: "τοῦ",          tl: "tu",          pt: "o" }
      - { el: "Κυρίου",       tl: "Kiríu",       pt: "Senhor" }
      - { el: "αἰτησώμεθα.",  tl: "etisómetha.", pt: "peçamos" }
    pt: "Um anjo de paz, guia fiel, guardião das nossas almas e dos nossos corpos, peçamos ao Senhor."
    segments:
      - { words: "0-3" }    # um anjo de paz, guia fiel,
      - { words: "4-10" }   # guardião das nossas almas e dos nossos corpos
      - { words: "11-14" }  # peçamos ao Senhor
    context_pt: >-
      A mais amada das petições da Litania das Súplicas. Pedimos um anjo que
      guarde alma e corpo — e o povo responde «Παράσχου, Κύριε». O γγ de
      «Ἄγγελον» soa como o nh de «banho»: «Ányelon».
    source: "Divina Liturgia (GOA), p. 16"
    tags: [liturgia, litania, diacono, para-reconhecer]
    voice: nestoras
    review: pending

  - id: paraschu-kyrie
    kind: phrase
    greek: "Παράσχου, Κύριε."
    tts: "Παράσχου, Κύριε."
    words:
      - { el: "Παράσχου,", tl: "Paráschu,", pt: "concede" }
      - { el: "Κύριε.",    tl: "Kírie.", pt: "Senhor" }
    pt: "Concede, Senhor."
    gloss:
      - { el: "παράσχου", pt: "concede (imperativo)" }
      - { el: "Κύριε",    pt: "Senhor" }
    context_pt: >-
      Resposta às petições da litania da súplica («Um dia todo perfeito,
      santo, pacífico e sem pecado…»). O ου soa /u/: «Paráschu».
    source: "Divina Liturgia de S. João Crisóstomo"
    tags: [liturgia, litania, resposta-do-povo]
    voice: athina
    review: pending
