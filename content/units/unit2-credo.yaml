  - id: credo-8
    kind: phrase
    title: "e de novo há de vir"
    greek: "Καὶ πάλιν ἐρχόμενον μετὰ δόξης, κρῖναι ζῶντας καὶ νεκρούς, οὗ τῆς βασιλείας οὐκ ἔσται τέλος."
