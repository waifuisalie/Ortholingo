      - { el: "τοῦ", tl: "tu", pt: "do" }
      - { el: "Πατρὸς", tl: "Patrós", pt: "Pai" }
      - { el: "καὶ", tl: "ke", pt: "e" }
      - { el: "τοῦ", tl: "tu", pt: "do" }
      - { el: "Υἱοῦ", tl: "Iiú", pt: "Filho" }
