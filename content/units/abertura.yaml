unit:
  id: abertura
  title: "A Abertura · Bênção e Grande Litania"
  section: catecumenos
  order: 2
  intro_pt: >-
    A Liturgia começa. O sacerdote bendiz o Reino, e o diácono — de estola
    erguida, diante do iconostásio — entoa a Grande Litania: uma petição após
    a outra, cada uma terminando «…oremos ao Senhor». O povo responde «Κύριε,
    ἐλέησον» e se persigna. Aqui você reconhece a abertura e aprende a responder.

items:
  - id: evlogimeni-i-vasilia
    kind: phrase
    title: "a bênção de abertura"   # short name for "parte 1 de 3 · …"
    greek: "Εὐλογημένη ἡ βασιλεία τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων."
    tts: "Ευλογημένη η βασιλεία του Πατρός και του Υιού και του αγίου Πνεύματος, νυν και αει και εις τους αιώνας των αιώνων."
    words:
      - { el: "Εὐλογημένη", tl: "Evloyiméni", pt: "bendito" }
      - { el: "ἡ",          tl: "i",          pt: "o" }
      - { el: "βασιλεία",   tl: "vasilía",    pt: "reino" }
      - { el: "τοῦ",        tl: "tu",         pt: "do" }
      - { el: "Πατρὸς",     tl: "Patrós",     pt: "Pai" }
      - { el: "καὶ",        tl: "ke",         pt: "e" }
      - { el: "τοῦ",        tl: "tu",         pt: "do" }
      - { el: "Υἱοῦ",       tl: "Iú",         pt: "Filho" }
      - { el: "καὶ",        tl: "ke",         pt: "e" }
      - { el: "τοῦ",        tl: "tu",         pt: "do" }
      - { el: "ἁγίου",      tl: "ayíu",       pt: "santo" }
      - { el: "Πνεύματος,", tl: "Pnévmatos,", pt: "Espírito" }
      - { el: "νῦν",        tl: "nin",        pt: "agora" }
      - { el: "καὶ",        tl: "ke",         pt: "e" }
      - { el: "ἀεὶ",        tl: "aí",         pt: "sempre" }
      - { el: "καὶ",        tl: "ke",         pt: "e" }
      - { el: "εἰς",        tl: "is",         pt: "para" }
      - { el: "τοὺς",       tl: "tus",        pt: "os" }
      - { el: "αἰῶνας",     tl: "eónas",      pt: "séculos" }
      - { el: "τῶν",        tl: "ton",        pt: "dos" }
      - { el: "αἰώνων.",    tl: "eónon.",     pt: "séculos" }
    pt: "Bendito seja o reino do Pai e do Filho e do Espírito Santo, agora e sempre e pelos séculos dos séculos."
    segments:
      - { words: "0-2" }
      - { words: "3-11" }
      - { words: "12-20" }
    context_pt: >-
      As primeiríssimas palavras da Liturgia: o sacerdote bendiz o Reino, e o
      povo responde «Ἀμήν». Repare que termina com o «νῦν καὶ ἀεὶ…» que você já
      conhece — e aqui é «Υἱοῦ» (do Filho, genitivo), não «Υἱῷ».
    source: "Divina Liturgia (GOA), p. 1"
    tags: [liturgia, enarxis, sacerdote, para-reconhecer]
    voice: nestoras
    review: pending

  - id: amin
    kind: phrase
    greek: "Ἀμήν."
    tts: "Αμήν."
    words:
      - { el: "Ἀμήν.", tl: "Amín." }
    pt: "Amém."
    gloss:
      - { el: "Ἀμήν", pt: "assim seja (do hebraico)" }
    context_pt: >-
      O selo de toda oração. Em grego soa «Amín» — com i. O povo o diz ao fim
      de cada doxologia do sacerdote.
    source: "Devocional, p. 8"
    tags: [liturgia, resposta-do-povo]
    voice: athina
    review: pending

  - id: en-irini
    kind: phrase
    greek: "Ἐν εἰρήνῃ τοῦ Κυρίου δεηθῶμεν."
    tts: "Εν ειρήνη του Κυρίου δεηθώμεν."
    words:
      - { el: "Ἐν",         tl: "En" }
      - { el: "εἰρήνῃ",     tl: "iríni" }
      - { el: "τοῦ",        tl: "tu" }
      - { el: "Κυρίου",     tl: "Kiríu" }
      - { el: "δεηθῶμεν.",  tl: "deithómen." }
    pt: "Em paz, oremos ao Senhor."
    gloss:
      - { el: "ἐν εἰρήνῃ", pt: "em paz" }
      - { el: "δεηθῶμεν",  pt: "oremos, roguemos" }
    context_pt: >-
      A primeira petição da Grande Litania — a «Litania da Paz» (Εἰρηνικά),
      que leva o nome destas palavras. O diácono a proclama de pé, diante do
      iconostásio, erguendo a estola; o povo responde «Κύριε, ἐλέησον». Toda
      petição termina igual: «…τοῦ Κυρίου δεηθῶμεν».
    source: "Divina Liturgia (GOA), p. 1"
    tags: [liturgia, enarxis, litania, diacono, para-reconhecer]
    voice: nestoras
    review: pending

  - id: kyrie-eleison
    kind: phrase
    greek: "Κύριε, ἐλέησον."
    tts: "Κύριε, ελέησον."
    words:
      - { el: "Κύριε,",   tl: "Kírie," }
      - { el: "ἐλέησον.", tl: "eléison." }
    pt: "Senhor, tem piedade."
    gloss:
      - { el: "Κύριε",   pt: "Senhor (vocativo — chamando)" }
      - { el: "ἐλέησον", pt: "tem piedade (imperativo)" }
    context_pt: >-
      A resposta mais frequente de toda a Liturgia — o povo a repete a cada
      petição das litanias, mais de doze vezes por celebração. É também o
      coração da Oração de Jesus.
    source: "Devocional, p. 8–9"
    tags: [liturgia, litania, resposta-do-povo]
    voice: athina
    review: pending

  - id: iper-irinis-kosmou
    kind: phrase
    title: "a paz do mundo"   # short name for "parte 1 de 3 · …"
    greek: "Ὑπὲρ τῆς εἰρήνης τοῦ σύμπαντος κόσμου, εὐσταθείας τῶν ἁγίων τοῦ Θεοῦ Ἐκκλησιῶν καὶ τῆς τῶν πάντων ἑνώσεως τοῦ Κυρίου δεηθῶμεν."
    tts: "Υπέρ της ειρήνης του σύμπαντος κόσμου, ευσταθείας των αγίων του Θεού Εκκλησιών και της των πάντων ενώσεως του Κυρίου δεηθώμεν."
    words:
      - { el: "Ὑπὲρ",        tl: "Ipér",       pt: "por" }
      - { el: "τῆς",         tl: "tis",        pt: "da" }
      - { el: "εἰρήνης",     tl: "irínis",     pt: "paz" }
      - { el: "τοῦ",         tl: "tu",         pt: "do" }
      - { el: "σύμπαντος",   tl: "símbandos",  pt: "inteiro" }
      - { el: "κόσμου,",     tl: "kósmu,",     pt: "mundo" }
      - { el: "εὐσταθείας",  tl: "efstathías", pt: "estabilidade" }
      - { el: "τῶν",         tl: "ton",        pt: "das" }
      - { el: "ἁγίων",       tl: "ayíon",      pt: "santas" }
      - { el: "τοῦ",         tl: "tu",         pt: "de" }
      - { el: "Θεοῦ",        tl: "Theú",       pt: "Deus" }
      - { el: "Ἐκκλησιῶν",   tl: "Eklisión",   pt: "Igrejas" }
      - { el: "καὶ",         tl: "ke",         pt: "e" }
      - { el: "τῆς",         tl: "tis",        pt: "da" }
      - { el: "τῶν",         tl: "ton",        pt: "de" }
      - { el: "πάντων",      tl: "pándon",     pt: "todos" }
      - { el: "ἑνώσεως",     tl: "enóseos",    pt: "união" }
      - { el: "τοῦ",         tl: "tu",         pt: "do" }
      - { el: "Κυρίου",      tl: "Kiríu",      pt: "Senhor" }
      - { el: "δεηθῶμεν.",   tl: "deithómen.", pt: "oremos" }
    pt: "Pela paz do mundo inteiro, pela estabilidade das santas Igrejas de Deus e pela união de todos, oremos ao Senhor."
    segments:
      - { words: "0-5" }    # pela paz do mundo inteiro,
      - { words: "6-11" }   # pela estabilidade das santas Igrejas de Deus
      - { words: "12-19" }  # e pela união de todos, oremos ao Senhor
    context_pt: >-
      Uma das petições da Grande Litania — ouça o padrão: «Ὑπὲρ [intenção]…
      τοῦ Κυρίου δεηθῶμεν» («Por [tal coisa]… oremos ao Senhor»). Esta pede a
      paz do mundo e a união de todos.
    source: "Divina Liturgia (GOA), p. 2"
    tags: [liturgia, enarxis, litania, diacono, para-reconhecer]
    voice: nestoras
    review: pending

  - id: antilavou
    kind: phrase
    title: "o amparo final"   # short name for "parte 1 de 2 · …"
    greek: "Ἀντιλαβοῦ, σῶσον, ἐλέησον καὶ διαφύλαξον ἡμᾶς, ὁ Θεός, τῇ σῇ χάριτι."
    tts: "Αντιλαβού, σώσον, ελέησον και διαφύλαξον ημάς, ο Θεός, τη ση χάριτι."
    words:
      - { el: "Ἀντιλαβοῦ,",  tl: "Andilavú,",  pt: "ampara" }
      - { el: "σῶσον,",      tl: "sóson,",     pt: "salva" }
      - { el: "ἐλέησον",     tl: "eléison",    pt: "tem piedade" }
      - { el: "καὶ",         tl: "ke",         pt: "e" }
      - { el: "διαφύλαξον",  tl: "diafílaxon", pt: "guarda" }
      - { el: "ἡμᾶς,",       tl: "imás,",      pt: "nos" }
      - { el: "ὁ",           tl: "o",          pt: "ó" }
      - { el: "Θεός,",       tl: "Theós,",     pt: "Deus" }
      - { el: "τῇ",          tl: "ti",         pt: "pela" }
      - { el: "σῇ",          tl: "si",         pt: "tua" }
      - { el: "χάριτι.",     tl: "cháriti.",   pt: "graça" }
    pt: "Ampara-nos, salva-nos, tem piedade de nós e guarda-nos, ó Deus, pela tua graça."
    segments:
      - { words: "0-5" }   # ampara, salva, tem piedade e guarda-nos,
      - { words: "6-10" }  # ó Deus, pela tua graça
    context_pt: >-
      O refrão que fecha as petições de cada litania, logo antes do «Τῆς
      παναγίας…». Quando você o ouve, a litania está chegando ao fim. Repare no
      «ἐλέησον» — a mesma palavra de «Κύριε, ἐλέησον».
    source: "Divina Liturgia (GOA), p. 3"
    tags: [liturgia, enarxis, litania, diacono, para-reconhecer]
    voice: nestoras
    review: pending

  - id: tis-panagias
    kind: phrase
    title: "a conclusão da litania"   # short name for "parte 1 de 4 · …"
    greek: "Τῆς παναγίας, ἀχράντου, ὑπερευλογημένης, ἐνδόξου, δεσποίνης ἡμῶν Θεοτόκου καὶ ἀειπαρθένου Μαρίας μετὰ πάντων τῶν ἁγίων μνημονεύσαντες, ἑαυτοὺς καὶ ἀλλήλους καὶ πᾶσαν τὴν ζωὴν ἡμῶν Χριστῷ τῷ Θεῷ παραθώμεθα."
    tts: "Της παναγίας, αχράντου, υπερευλογημένης, ενδόξου, δεσποίνης ημών Θεοτόκου και αειπαρθένου Μαρίας μετά πάντων των αγίων μνημονεύσαντες, εαυτούς και αλλήλους και πάσαν την ζωήν ημών Χριστώ τω Θεώ παραθώμεθα."
    words:
      - { el: "Τῆς",              tl: "Tis",              pt: "a" }
      - { el: "παναγίας,",        tl: "panayías,",        pt: "toda-santa" }
      - { el: "ἀχράντου,",        tl: "achrándu,",        pt: "imaculada" }
      - { el: "ὑπερευλογημένης,", tl: "iperevloyiménis,", pt: "sobremaneira bendita" }
      - { el: "ἐνδόξου,",         tl: "endóxu,",          pt: "gloriosa" }
      - { el: "δεσποίνης",        tl: "despínis",         pt: "Senhora" }
      - { el: "ἡμῶν",             tl: "imón",             pt: "nossa" }
      - { el: "Θεοτόκου",         tl: "Theotóku",         pt: "Theotókos" }
      - { el: "καὶ",              tl: "ke",               pt: "e" }
      - { el: "ἀειπαρθένου",      tl: "aiparthénu",       pt: "sempre-virgem" }
      - { el: "Μαρίας",           tl: "Marías",           pt: "Maria" }
      - { el: "μετὰ",             tl: "metá",             pt: "com" }
      - { el: "πάντων",           tl: "pándon",           pt: "todos" }
      - { el: "τῶν",              tl: "ton",              pt: "os" }
      - { el: "ἁγίων",            tl: "ayíon",            pt: "santos" }
      - { el: "μνημονεύσαντες,",  tl: "mnimonéfsandes,",  pt: "recordando" }
      - { el: "ἑαυτοὺς",          tl: "eaftús",           pt: "a nós mesmos" }
      - { el: "καὶ",              tl: "ke",               pt: "e" }
      - { el: "ἀλλήλους",         tl: "allílus",          pt: "uns aos outros" }
      - { el: "καὶ",              tl: "ke",               pt: "e" }
      - { el: "πᾶσαν",            tl: "pásan",            pt: "toda" }
      - { el: "τὴν",              tl: "tin",              pt: "a" }
      - { el: "ζωὴν",             tl: "zoín",             pt: "vida" }
      - { el: "ἡμῶν",             tl: "imón",             pt: "nossa" }
      - { el: "Χριστῷ",           tl: "Christó",          pt: "a Cristo" }
      - { el: "τῷ",               tl: "to",               pt: "o" }
      - { el: "Θεῷ",              tl: "Theó",             pt: "Deus" }
      - { el: "παραθώμεθα.",      tl: "parathómetha.",    pt: "entreguemos" }
    pt: "Recordando a nossa toda-santa, imaculada, sobremaneira bendita e gloriosa Senhora, a Theotókos e sempre-virgem Maria, com todos os santos, entreguemo-nos a nós mesmos, uns aos outros, e toda a nossa vida a Cristo, nosso Deus."
    segments:
      - { words: "0-4" }    # a toda-santa, imaculada, sobremaneira bendita, gloriosa,
      - { words: "5-10" }   # nossa Senhora Theotókos e sempre-virgem Maria
      - { words: "11-15" }  # com todos os santos, recordando,
      - { words: "16-27" }  # entreguemo-nos a nós mesmos, uns aos outros, e toda a nossa vida a Cristo, nosso Deus
    context_pt: >-
      A conclusão que o diácono dá a cada litania — longa, mas você a ouvirá
      muitas vezes. Termina pedindo que entreguemos tudo a Cristo; e o povo
      responde com o «Σοί, Κύριε» que você já sabe.
    source: "Divina Liturgia (GOA), p. 17"
    tags: [liturgia, litania, diacono, para-reconhecer]
    voice: nestoras
